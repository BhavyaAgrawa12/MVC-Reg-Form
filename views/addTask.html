<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task</title>
  <link rel="stylesheet" href="/css/output.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
</head>
<body class="bg-sky-50 min-h-screen">

  {{> appHeader}}

  <div class="max-w-6xl mx-auto px-6 py-10">

    <div class="bg-white max-w-lg mx-auto rounded-2xl shadow-xl p-8">

      <h2 class="text-3xl font-bold text-slate-800 mb-6">
        Create New Task
      </h2>

      {{#each errors}}
      <div class="bg-red-100 text-red-600 p-3 rounded-lg mb-4">
        {{message}}
      </div>
      {{/each}}

      <form action="/task/add" method="POST" class="space-y-5">

        <div>
          <label class="block text-sm text-slate-600 mb-2">
            Task Title
          </label>

          <input
            type="text"
            name="title"
            value="{{title}}"
            placeholder="Enter task title"
            class="w-full border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400"
          >
        </div>

        <div>
          <label class="block text-sm text-slate-600 mb-2">
            Description
          </label>

          <textarea
            name="description"
            rows="4"
            placeholder="Enter task description"
            class="w-full border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400"
          >{{description}}</textarea>
        </div>

        <div class="flex gap-3">

          <button
            type="submit"
            class="bg-sky-500 text-white px-6 py-3 rounded-lg hover:bg-sky-600 transition-all duration-200"
          >
            Save Task
          </button>

          <a
            href="/home"
            class="bg-slate-200 text-slate-700 px-6 py-3 rounded-lg hover:bg-slate-300 transition-all duration-200"
          >
            Cancel
          </a>

        </div>

      </form>

    </div>

  </div>

</body>
</html>
